<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE08B" />
      <stop offset="50%" stop-color="#DFAC38" />
      <stop offset="100%" stop-color="#9A6B12" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D0B12" />
      <stop offset="100%" stop-color="#1A0407" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Outer Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Decorative Inner Border -->
  <rect x="6" y="6" width="52" height="52" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.6" stroke-dasharray="3 1.5" />
  
  <!-- Gold Side Accents -->
  <rect x="4" y="22" width="2" height="20" rx="1" fill="url(#goldGrad)" />
  <rect x="58" y="22" width="2" height="20" rx="1" fill="url(#goldGrad)" />
  
  <!-- ADSP Monogram -->
  <g filter="url(#glow)">
    <text x="32" y="38" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">ADSP</text>
    <text x="32" y="48" font-family="'Inter', sans-serif" font-size="5.5" font-weight="700" fill="#FCE08B" text-anchor="middle" letter-spacing="1.5">AMARDEEP</text>
  </g>
</svg>